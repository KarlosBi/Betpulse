; BetPulse - SOLO DESARROLLO
; En Docker Desktop (Windows) el bind mount 9p/drvfs asigna root a todo archivo
; creado desde Windows o con `php artisan`. Para que la web y la CLI escriban en
; storage/ y bootstrap/cache sin conflictos de permisos, los workers de PHP-FPM
; corren con el mismo usuario que la CLI (requiere `php-fpm -R`).
; No usar esta configuración en producción.
[www]
user = root
group = root
